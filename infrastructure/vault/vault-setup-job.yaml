apiVersion: batch/v1
kind: Job
metadata:
  name: vault-setup
  namespace: vault
spec:
  template:
    spec:
      containers:
      - name: setup
        image: hashicorp/vault:1.17
        command:
          - /bin/sh
          - -c
          - |
            #!/bin/sh
            set -e

            echo "Waiting for Vault to be ready and unsealed..."
            until vault status > /dev/null 2>&1; do
              sleep 2
            done

            echo "Enabling Kubernetes auth..."
            vault auth enable kubernetes || true

            echo "Configuring Kubernetes auth..."
            vault write auth/kubernetes/config \
              kubernetes_host="https://kubernetes.default.svc:443" \
              kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
              disable_iss_validation=true

            echo "Creating policy..."
            vault policy write task-manager-policy - <<EOF
            path "secret/data/task-manager/*" {
              capabilities = ["read"]
            }
            path "secret/data/postgres/*" {
              capabilities = ["read"]
            }
            EOF

            echo "Creating role..."
            vault write auth/kubernetes/role/task-manager-role \
              bound_service_account_names=default \
              bound_service_account_namespaces=pet-project \
              policies=task-manager-policy \
              ttl=24h
            
            echo "Vault setup completed successfully!"
        env:
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-init-token
              key: root_token
      restartPolicy: OnFailure