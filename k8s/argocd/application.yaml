apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pet-project
  namespace: argocd
spec:
  project: default
  source:
    # Ваш локальный GitLab (IP 192.168.0.101)
    repoURL: http://192.168.0.101:8929/root/Python_in_Kubernetes.git
    targetRevision: main
    path: k8s
  destination:
    # Внутренний адрес API Kubernetes (для Argo CD, работающего внутри кластера)
    server: https://kubernetes.default.svc
    namespace: pet-project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
