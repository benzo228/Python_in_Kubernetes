apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "task-manager-role"
          serviceAccountRef:
            name: "default"
            namespace: "pet-project"
---
# Секрет для FastAPI (переменные окружения)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: task-manager-secrets
  namespace: pet-project
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: task-manager-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: task-manager/config
        property: DATABASE_URL
    - secretKey: SECRET_KEY
      remoteRef:
        key: task-manager/config
        property: SECRET_KEY
---
# Секрет для PostgreSQL (пароль от БД)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret-sync
  namespace: pet-project
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-secret # Именно это имя ждет наша база данных
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgres/config
        property: password