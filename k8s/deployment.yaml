apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  namespace: pet-project
  labels:
    app: task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      serviceAccountName: task-manager-sa
      imagePullSecrets:
      - name: harbor-credentials
      containers:
      - name: app
        image: 192.168.49.2:30002/pet-project/task-manager:30264312
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: task-manager-secret # <--- Подтягиваем секрет от ESO
        env:
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"