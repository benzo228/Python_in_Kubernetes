stages:
  - lint
  - build
  - deploy

variables:
  # Адрес Harbor внутри кластера Minikube
  HARBOR_HOST: "192.168.49.2:30002"
  # Имя проекта и образа в Harbor
  IMAGE_TAG: "$HARBOR_HOST/pet-project/task-manager:$CI_COMMIT_SHORT_SHA"

lint:
  stage: lint
  image: python:3.12-slim
  tags:
    - kubernetes
  before_script:
    - pip install --no-cache-dir uv
    - uv pip install --system --no-cache ruff
  script:
    - ruff check app/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - kubernetes
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_HOST\":{\"username\":\"$HARBOR_USER\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_TAG}"
      --insecure
      --insecure-pull
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - kubernetes
  script:
    - kubectl config set-cluster minikube --server="$KUBE_SERVER" --insecure-skip-tls-verify=true
    - kubectl config set-credentials gitlab --token="$KUBE_TOKEN"
    - kubectl config set-context default --cluster=minikube --user=gitlab
    - kubectl config use-context default
    - kubectl set image deployment/task-manager app="$IMAGE_TAG" -n pet-project
    - kubectl rollout status deployment/task-manager -n pet-project --timeout=5m
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        kubectl rollout undo deployment/task-manager -n pet-project
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"